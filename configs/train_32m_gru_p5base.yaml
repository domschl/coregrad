# Phase 5.2 Base Plateau: 33M looped-16 (2+4x3+2) Outer GRU Depth-RNN
# 1.2B-token pure WSD plateau (decay_fraction=0.0) with locked Muon (0.015 / 0.05)
run_name: coregrad_32m_gru_p5base
model_config: configs/model_32m_looped16_gru.yaml
optimizer: muon
total_tokens: 1200000000
seq_len: 2048
micro_batch: 8
grad_accum: 8
peak_lr: 8.0e-4
min_lr: 8.0e-5
muon_lr: 0.015
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.02
decay_fraction: 0.0
decay_style: cosine
compile_model: true
activation_checkpointing: false
seed: 1337
log_interval: 50
eval_interval: 1000
eval_val_batches: 16
sample_count: 6
sample_max_tokens: 112
save_interval: 3000
mixture:
  edu-en: 0.45
  cosmo: 0.25
  code-starcoder: 0.17
  finemath: 0.13
