# Stage 2B (v2): Diverse open-domain RAG (SQuAD v2) + GSM8K word-problem calc +
# system-prompt-aligned SmolTalk chat + fictional multi-hop retrieval & calc
run_name: coregrad_125m_sft_v2
init_from: runs/coregrad_125m_base/best.pt
train_jsonl: data/phase3/sft/train.jsonl
val_jsonl: data/phase3/sft/val.jsonl
eval_tasks_json: data/phase3/eval_tasks.json
optimizer: adamw
seq_len: 2048
pack_sequences: true
micro_batch: 4
grad_accum: 8
epochs: 2
peak_lr: 1.5e-4
min_lr: 1.5e-5
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.05
compile_model: true
activation_checkpointing: false
seed: 2026
log_interval: 10
eval_interval: 250
rollout_probe_count: 4
