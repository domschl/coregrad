# Phase 4A: 25M looped-14 SFT v2 (locked Gate 2 dataset & protocol)
run_name: coregrad_25m_looped14_sft_v2
init_from: runs/coregrad_25m_looped14_base/best.pt
train_jsonl: data/phase3/sft/train.jsonl
val_jsonl: data/phase3/sft/val.jsonl
eval_tasks_json: data/phase3/eval_tasks.json
optimizer: adamw
seq_len: 2048
pack_sequences: true
micro_batch: 8
grad_accum: 4
epochs: 2
peak_lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.05
compile_model: true
activation_checkpointing: false
seed: 2026
log_interval: 10
eval_interval: 250
rollout_probe_count: 4
