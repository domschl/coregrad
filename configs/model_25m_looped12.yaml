# Phase 4A: coregrad-25m-looped12 (~26.1M params, 6 unique layers x 2 loops = 12 effective layers)
# Exact iso-width (d_model=512) and iso-FLOP match to coregrad-45m at 40% fewer parameters
name: coregrad-25m-looped12
vocab_size: 16384
max_seq_len: 2048
n_layer: 6
d_model: 512
n_heads: 8
n_kv_heads: 4
d_ff: 1408
rope_theta: 10000.0
norm_eps: 1.0e-6
qk_norm: true
tie_embeddings: true
n_loops: 2
loop_start: 0
loop_end: 6
loop_step_embed: true
