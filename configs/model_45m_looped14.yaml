# Phase 4A: coregrad-45m-looped14 (~45.0M params, 1 prelude + 4 core x 3 loops + 1 coda = 14 eff layers)
# Exact iso-parameter match to coregrad-45m (43.8M) using coregrad-125m's full d_model=768 residual width
name: coregrad-45m-looped14
vocab_size: 16384
max_seq_len: 2048
n_layer: 6
d_model: 768
n_heads: 12
n_kv_heads: 4
d_ff: 1664
rope_theta: 10000.0
norm_eps: 1.0e-6
qk_norm: true
tie_embeddings: true
n_loops: 3
loop_start: 1
loop_end: 5
loop_step_embed: true
