# Phase 5.2 Branch B (Interleaved Mid-Training): Light SFT polish after 50/50 interleaved WSD decay
run_name: coregrad_32m_gru_p5b_polish
init_from: runs/coregrad_32m_gru_p5b_interleaved/latest.pt
train_jsonl: data/phase5/sft/train.jsonl
val_jsonl: data/phase5/sft/val.jsonl
eval_tasks_json: data/phase3/eval_tasks.json
optimizer: adamw
seq_len: 2048
pack_sequences: true
micro_batch: 4
grad_accum: 8
epochs: 1
max_steps: 600
peak_lr: 1.0e-4
min_lr: 1.0e-5
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.05
compile_model: true
activation_checkpointing: false
seed: 2026
log_interval: 20
eval_interval: 200
rollout_probe_count: 4
