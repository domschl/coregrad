# Gate 4 Step 2: Masked Phase 5 SFT on coregrad-Byte (H-Net UTF-8 + Outer GRU)
run_name: gate4_32m_hnet_sft
init_from: runs/gate4_32m_hnet_gru_1.2gb/best.pt
train_jsonl: data/phase5/sft/train.jsonl
val_jsonl: data/phase5/sft/val.jsonl
eval_tasks_json: data/phase3/eval_tasks.json
optimizer: adamw
seq_len: 4096
pack_sequences: true
micro_batch: 4
grad_accum: 8
epochs: 2
max_steps: 2400
peak_lr: 2.5e-4
min_lr: 2.5e-5
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.05
compile_model: false
activation_checkpointing: false
seed: 2026
log_interval: 20
eval_interval: 400
rollout_probe_count: 4
