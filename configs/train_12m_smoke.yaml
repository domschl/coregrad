# Run 0: 12M smoke test (150M tokens, ~10 min on RTX 4070 Ti)
run_name: coregrad_12m_smoke
model_config: configs/model_12m.yaml
optimizer: adamw
total_tokens: 150000000
seq_len: 1024
micro_batch: 16
grad_accum: 4
peak_lr: 1.2e-3
min_lr: 1.2e-4
muon_lr: 0.02
weight_decay: 0.1
grad_clip: 1.0
warmup_fraction: 0.03
decay_fraction: 0.15
decay_style: cosine
compile_model: true
activation_checkpointing: false
seed: 1337
log_interval: 10
eval_interval: 200
eval_val_batches: 12
sample_count: 6
sample_max_tokens: 96
save_interval: 1000
mixture:
  edu-en: 0.45
  cosmo: 0.25
  code-starcoder: 0.17
  finemath: 0.13
