# Phase 4A (Gate 3): 45M Cognitive Core SFT v2 (identical dataset & protocol to 125M SFT v2)
run_name: coregrad_45m_sft_v2
init_from: runs/coregrad_45m_proto/best.pt
train_jsonl: data/phase3/sft/train.jsonl
val_jsonl: data/phase3/sft/val.jsonl
eval_tasks_json: data/phase3/eval_tasks.json
optimizer: adamw
seq_len: 2048
pack_sequences: true
micro_batch: 8
grad_accum: 4
epochs: 2
peak_lr: 2.5e-4
min_lr: 2.5e-5
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.05
compile_model: true
activation_checkpointing: false
seed: 2026
log_interval: 10
eval_interval: 250
rollout_probe_count: 4
