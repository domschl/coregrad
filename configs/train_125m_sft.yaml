# Stage 2B: Masked SFT on synthetic calc/retrieval + public tool/chat trajectories
# Includes optional RoPE theta scaling (2048 -> 4096) with activation checkpointing.
run_name: coregrad_125m_sft
init_from: runs/coregrad_125m_base/best.pt
train_jsonl: data/phase3/sft/train.jsonl
val_jsonl: data/phase3/sft/val.jsonl
optimizer: adamw
seq_len: 2048
rope_theta_override: 100000.0
micro_batch: 4
grad_accum: 8
epochs: 2
peak_lr: 1.5e-4
min_lr: 1.5e-5
weight_decay: 0.05
grad_clip: 1.0
warmup_fraction: 0.05
compile_model: true
activation_checkpointing: true
seed: 1337
log_interval: 10
eval_interval: 200
